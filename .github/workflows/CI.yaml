name: sentinel-ci

on: 
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs: 
  audit-changes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            critical:
              - 'LICENSE'
              - '.github/workflows/**'
              
      - name: Alert on Critical File Changes
        if: ${{ steps.filter.outputs.critical == 'true' }}
        run: |
          echo "::warning title=Critical Files Modified::The LICENSE or CI workflow files were modified in this run. Review carefully."
          
          echo "### ⚠️ Critical Files Modified" >> $GITHUB_STEP_SUMMARY
          echo "Changes were detected in either the \`LICENSE\` or the CI workflows (\`.github/workflows/\`). Please ensure these changes are intentional." >> $GITHUB_STEP_SUMMARY

  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22' 
          cache: true

      - name: Check Formatting (Server)
        working-directory: ./server
        run: | 
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files in /server are not formatted properly:"
            echo "$UNFORMATTED"
            echo "Run 'go fmt ./...' locally before pushing."
            exit 1
          fi

      - name: Check Formatting (SBOM)
        working-directory: ./sbom
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files in /sbom are not formatted properly:"
            echo "$UNFORMATTED"
            echo "Run 'go fmt ./...' locally before pushing."
            exit 1
          fi

      - name: Lint (Server)
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: ./server
          version: latest

      - name: Lint (SBOM)
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: ./sbom
          version: latest

  test-server:
    needs: lint-and-format
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        container_image: ["golang:1.22-jammy", "golang:1.22-bookworm"]
    container:
      image: ${{ matrix.container_image }}
    steps:
      - uses: actions/checkout@v4

      - name: Run Server Tests with Race Detector
        working-directory: ./server
        run: go test -v -race -cover ./...

      - name: Build Server
        working-directory: ./server
        run: go build -v -o server_bin .

      - name: Dry Run Server
        working-directory: ./server 
        run: |
          ./server_bin &
          SERVER_PID=$!
          
          for i in {1..5}; do
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "Server crashed during startup."
              exit 1
            fi
            sleep 1
          done
          
          echo "Server successfully booted and stayed alive."
          kill $SERVER_PID
          
  test-sbom:
    needs: lint-and-format
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        container_image: ["golang:1.22-jammy", "golang:1.22-bookworm"]
    container:
      image: ${{ matrix.container_image }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Package Manager Dependencies
        run: apt-get update && apt-get install -y rpm dpkg

      - name: Run SBOM Tests
        working-directory: ./sbom
        run: go test -v -race -cover ./...

      - name: Build SBOM
        working-directory: ./sbom
        run: go build -v -o sbom_bin .

      - name: Execute SBOM Generator
        working-directory: ./sbom
        run: ./sbom_bin
